version: "3.9"

# Ambiente local que reproduz em miniatura a arquitetura de producao:
# 2 instancias do game server (poderia ser 10+) atras de um load balancer
# Nginx com sticky session, coordenadas via Redis compartilhado.
#
# Uso:
#   docker compose up --build
#   Cliente conecta em ws://localhost:8080 (nginx), nao direto nas instancias.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: squad_tactics
      POSTGRES_USER: squad_tactics
      POSTGRES_PASSWORD: squad_tactics_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squad_tactics"]
      interval: 5s
      timeout: 3s
      retries: 5

  game-server-1:
    build: .
    restart: unless-stopped
    environment:
      PORT: 2567
      INSTANCE_ID: game-server-1
      REDIS_URL: redis://redis:6379
      USE_REDIS: "true"
    depends_on:
      redis:
        condition: service_healthy

  game-server-2:
    build: .
    restart: unless-stopped
    environment:
      PORT: 2567
      INSTANCE_ID: game-server-2
      REDIS_URL: redis://redis:6379
      USE_REDIS: "true"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - game-server-1
      - game-server-2

volumes:
  pgdata:
